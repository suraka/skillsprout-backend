name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skillsprout
          POSTGRES_PASSWORD: skillsprout
          POSTGRES_DB: skillsprout_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skillsprout -d skillsprout_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://skillsprout:skillsprout@localhost:5432/skillsprout_test
      TEST_DATABASE_URL: postgresql+asyncpg://skillsprout:skillsprout@localhost:5432/skillsprout_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run python -m app.seed
      - run: uv run python -m app.seed
      - run: uv run alembic check
      - run: uv run pytest -q
      - run: uv run ruff check app tests
