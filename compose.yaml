services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillsprout
      POSTGRES_PASSWORD: skillsprout
      POSTGRES_DB: skillsprout
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - skillsprout-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillsprout -d skillsprout"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://skillsprout:skillsprout@db:5432/skillsprout
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://skillsprout:skillsprout@db:5432/skillsprout
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  skillsprout-data:
